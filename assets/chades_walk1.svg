<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- チャデス風ドット絵（歩行1） -->
  <rect x="0" y="6" width="16" height="10" fill="#ffffff"/>
  <!-- 体（紫がかったダークカラー） -->
  <rect x="4" y="3" width="8" height="6" fill="#2E1A47"/>
  <!-- 顔のマスク（黄色） -->
  <rect x="6" y="1" width="4" height="2" fill="#FFD92E"/>
  <!-- 目（赤） -->
  <rect x="6" y="4" width="1" height="1" fill="#FF3B3B"/>
  <rect x="9" y="4" width="1" height="1" fill="#FF3B3B"/>
  <!-- 口/影 -->
  <rect x="7" y="5" width="2" height="1" fill="#1B0A2A"/>
  <!-- 足（影を薄く） -->
  <rect x="5" y="9" width="2" height="1" fill="#8A2BE2"/>
  <rect x="9" y="9" width="2" height="1" fill="#8A2BE2"/>
</svg>